# Cassie Actuator Net Configuration
# ==================================

robot_name: cassie
num_joints: 10  # Actuated joints only (excluding passive 4-bar linkage)

# MuJoCo model path (relative to project root)
mujoco_model: external/mujoco_menagerie/agility_cassie/scene.xml

# PD gains (should match your MuJoCo env)
pd_gains:
  kp: 100.0
  kd: 10.0

# Data collection settings
data_collection:
  random_episodes: 100
  steps_per_episode: 500
  joint_sweeps: 10
  position_range: [-0.3, 0.3]  # Smaller range for biped
  sweep_range: [-0.5, 0.5]

# Training settings
training:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  hidden_dims: [128, 64, 32]
  dropout: 0.1

# Output paths (relative to actuator_net/)
paths:
  data: data/cassie/actuator_data.csv
  model: models/cassie/actuator_net_jit.pt
  scaler: models/cassie/feature_scaler.pkl

# Isaac Lab integration
isaac_lab:
  effort_limit: 200.0  # Cassie has stronger motors
  velocity_limit: 20.0
  fallback_stiffness: 100.0
  fallback_damping: 10.0
